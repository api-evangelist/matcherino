name: Matcherino
description: Matcherino is an esports crowdfunding and tournament-management platform that provides
  monetization infrastructure for competitive gaming events of every scale, from college clubs to
  stadium finals. Its stack covers prize-pool crowdfunding, brackets, player signups, ticketing and
  entry fees, streaming overlays, sponsor activation, and a publisher dashboard for distributing cash
  and in-game prizes. Matcherino handles global payouts to organizers and winners across 120+ countries
  with tax-form collection, and surfaces real-time analytics for organizers, sponsors, and publishers.
  The company reports having paid out more than $5.2M across 14,000+ tournaments. Matcherino is a
  Techstars-backed company; it does not currently publish a public API or developer platform.
